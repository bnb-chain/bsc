services:
  genesis:
    image: bsc-genesis
    env_file: .env
    environment:
      NUMS_OF_VALIDATOR: 1
    volumes:
      - ./storage:/home/bsc/storage
      - ./scripts:/home/bsc/scripts:ro
      - ./config:/home/bsc/config:ro
      - ./init-holders:/home/bsc/init-holders:ro
    command: /home/bsc/scripts/bootstrap.sh
  
  bsc-rpc:
    image: bsc
    healthcheck:
      test: nc -z localhost 8545
      interval: 3s
      timeout: 5s
      retries: 15
    env_file: .env
    environment:
      NODE_ID: bsc-rpc
    volumes:
      - ./storage/bsc-rpc:/home/bsc/.ethereum
      - ./scripts:/scripts:ro
      - ./config:/config:ro
    entrypoint: [ "sh", "-c", "/scripts/bsc-rpc.sh" ]
    networks:
      default:
        ipv4_address: 99.1.0.3

  bsc-validator1:
    image: bsc
    env_file: .env
    environment:
      NODE_ID: bsc-validator1
      BOOTSTRAP_HOST: bsc-rpc
    volumes:
      - ./storage/bsc-validator1:/home/bsc/.ethereum
      - ./scripts:/scripts:ro
    entrypoint: [ "sh", "-c", "/scripts/bsc-validator.sh" ]
    networks:
      default:
        ipv4_address: 99.1.0.2
  
  truffle-test:
    image: truffle-test
    command: /scripts/truffle-test.sh
    env_file: .env
    environment:
      RPC_HOST: bsc-rpc
      RPC_PORT: 8545
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      bsc-rpc:
        condition: service_healthy

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 99.1.0.0/16
