name: Go Nancy

on:
    # Scan changed files in PRs from same repository only:
    pull_request:
      types: [opened, synchronize, reopened]
    # Scan on-demand through GitHub Actions interface:
    workflow_dispatch: {}
    # Scan mainline branches and report all findings:
    push:
      branches: ["master", "develop", "coinbosa-**"]

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
        matrix:
          go-version: [1.25.x]
          os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 1.x in order to write go.list file
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Install Nancy
      # Le binaire est vérifié par empreinte AVANT d'être exécuté : un scanner de
      # sécurité téléchargé sans contrôle serait lui-même un vecteur d'attaque.
      # Empreinte publiée par l'éditeur (nancychecksums.txt de la release v1.0.52).
      env:
        NANCY_SHA256: 73cf5d140491c937bc6361da0ab9e9ac4565741fa34e998c4bc0ebc0efc77f45
      run: |
        set -euo pipefail
        curl -sSL --retry 3 -o nancy \
          https://github.com/sonatype-nexus-community/nancy/releases/download/v1.0.52/nancy-v1.0.52-linux-amd64
        echo "${NANCY_SHA256}  nancy" | sha256sum -c - \
          || { echo "::error::empreinte du binaire nancy inattendue — installation refusée"; exit 1; }
        chmod +x nancy
        sudo mv nancy /usr/local/bin/

    - name: Nancy Security Scan
      shell: bash
      env:
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
      run: |
        if [[ -z "${OSSINDEX_USERNAME:-}" || -z "${OSSINDEX_TOKEN:-}" ]]; then
          echo "::error::Missing OSS Index credentials"
        fi
        
        go list -json -deps ./... | nancy sleuth --username "${OSSINDEX_USERNAME}" --token "${OSSINDEX_TOKEN}"
