name: Coinbosa

# Vérifie que la chaîne démarre réellement, franchit un bloc d'epoch, et que le
# standard BRC20 se comporte comme spécifié. Les tests tournent contre un nœud
# Coinbosa lancé pour l'occasion — pas contre un simulateur.

# Les chemins surveillés incluent tout ce qui change le BINAIRE produit, pas seulement le
# code Coinbosa : la chaîne d'outils et les dépendances (go.mod / go.sum) et la chaîne de
# compilation (Makefile, build/) en font partie. Sans cela, un changement de compilateur
# — qui modifie pourtant le binaire des validateurs — passait sans qu'aucun test de chaîne
# ne tourne : temps de bloc, franchissement d'epoch et banc BRC20 restaient non vérifiés.
on:
  push:
    branches: [master, main, 'coinbosa-**']
    paths: ['coinbosa/**', 'consensus/parlia/**', 'go.mod', 'go.sum', 'Makefile', 'build/**', '.github/workflows/coinbosa.yml']
  pull_request:
    paths: ['coinbosa/**', 'consensus/parlia/**', 'go.mod', 'go.sum', 'Makefile', 'build/**', '.github/workflows/coinbosa.yml']
  workflow_dispatch:

jobs:
  chaine-et-contrats:
    name: Chaîne et contrats
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique complet est requis : le controle ci-dessous compare les
          # commits pousses a leur base, ce qu'un checkout superficiel interdit.
          fetch-depth: 0

      # --- aucune signature d'outil dans les messages de commit ---
      # Un auditeur externe a ouvert ce depot et y a lu, dans les messages de commit
      # de la branche par defaut, la signature de l'outil qui les avait rediges. Le
      # depot doit montrer le travail de l'equipe, et un commit n'a qu'un auteur : la
      # personne qui en repond. La regle existait dans AGENTS.md ; rien ne la faisait
      # respecter, et 21 commits sont passes.
      - name: Aucune signature d'outil dans les commits
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Controle des commits $base..HEAD"
          # -i  : la casse ne doit pas servir de contournement.
          # ^   : ANCRE EN DEBUT DE LIGNE, et c'est essentiel. Un pied de page git
          #       commence toujours une ligne. Sans l'ancre, la barriere s'arretait
          #       sur un commit qui se CONTENTAIT de citer la regle en prose — elle
          #       a commence par se bloquer elle-meme. Une barriere qui punit le fait
          #       d'en parler est une barriere qu'on finit par desactiver.
          fautifs=$(git log --format='%H %s%n%b' "$base..HEAD" \
            | grep -iE '^[[:space:]]*(co-authored-by:[[:space:]]*.*(claude|cursor|copilot|codex|anthropic|openai|noreply@anthropic|cursoragent@)|(.{0,4})?generated with .*(claude|cursor|copilot|codex))' \
            || true)
          if [ -n "$fautifs" ]; then
            echo "::error::Un message de commit porte la signature d'un outil."
            echo "$fautifs"
            echo ""
            echo "Retire le pied de page du message, puis reecris le commit :"
            echo "  git commit --amend     (dernier commit)"
            echo "  git rebase -i <base>   (plusieurs commits)"
            exit 1
          fi
          echo "Aucune signature d'outil."

      # --- cohérence du site vitrine ---
      # Placé avant toute compilation : ne dépend ni de Go ni de Node, coûte deux
      # secondes, et échoue vite. Le site est fait de cinq fichiers HTML qui
      # recopient le même en-tête et le même pied ; sans ce contrôle, une entrée de
      # menu ajoutée sur quatre pages sur cinq passe inaperçue jusqu'en production.
      # Le contrôle couvre aussi ce qu'un relecteur ne voit pas : un canonical
      # dupliqué, un gestionnaire d'événement inline que la CSP tuerait
      # silencieusement, un saut de niveau de titre, et une ressource modifiée dont
      # l'empreinte de cache n'a pas été recalculée — auquel cas les visiteurs déjà
      # venus garderaient l'ancienne version pendant un an.
      - name: Cohérence des pages du site
        run: python3 coinbosa/site/coque.py --verifier

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- le patch Coinbosa doit être présent, sinon les blocs font 3 s ---
      - name: Vérifier le patch du temps de bloc
        run: |
          grep -q 'defaultBlockInterval uint64 = 5000' consensus/parlia/parlia.go \
            || { echo "::error::le patch 5 s est absent de consensus/parlia/parlia.go"; exit 1; }
          echo "patch 5 s présent"

      # --- la propriété la plus dangereuse du réseau, vérifiée à chaque push ---
      # Passer de 1 à 2 validateurs alors qu'un seul nœud scelle ARRÊTE la chaîne au
      # bloc d'epoch suivant, silencieusement, et de façon irréversible : plus aucun
      # bloc n'étant produit, aucune transaction corrective ne peut être minée.
      # Le test de reproduction existait au dépôt mais n'était exécuté par AUCUN
      # workflow de cette branche — la garantie la plus critique du projet reposait
      # donc sur un test que personne ne lançait.
      - name: Test d'arrêt de chaîne (ajout d'un validateur)
        run: go test ./consensus/parlia -run TestCoinbosa -count=1 -v

      - name: Compiler le client Coinbosa
        run: make geth

      - name: Installer les dépendances (reproductible, depuis le lock)
        working-directory: coinbosa
        run: npm ci --no-audit --no-fund

      # Barrière bloquante : toute vulnérabilité npm non explicitement dérogée
      # (avec preuve de non-atteignabilité ET date d'expiration) fait échouer la CI.
      - name: Auditer les dépendances npm
        working-directory: coinbosa
        run: node scripts/audit-deps.js

      - name: Compiler les contrats
        working-directory: coinbosa
        run: node scripts/compile.js

      # --- genesis et démarrage ---
      - name: Générer le validateur et le genesis
        working-directory: coinbosa
        run: |
          echo "coinbosa-ci" > pw.txt
          VALIDATOR=$(../build/bin/geth account new --datadir node1 --password pw.txt 2>&1 \
                      | grep -oE '0x[a-fA-F0-9]{40}' | head -1)
          echo "VALIDATOR=$VALIDATOR" >> $GITHUB_ENV
          echo "validateur : $VALIDATOR"
          # ALLOW_DEV : la CI vérifie la mécanique, pas la production. Les adresses de
          # distribution restent des placeholders déterministes non dépensables, et le
          # genesis produit est écrit sur un chemin DISTINCT (genesis-coinbosa-dev.json)
          # avec le marqueur coinbosaDev — il ne peut pas être confondu avec la production.
          VALIDATOR=$VALIDATOR ALLOW_DEV=1 node scripts/build-genesis.js
          ../build/bin/geth init --datadir node1 genesis/genesis-coinbosa-dev.json

      - name: Démarrer le nœud
        working-directory: coinbosa
        run: |
          nohup ../build/bin/geth --datadir node1 --networkid 26262 --port 30303 --ipcdisable \
            --http --http.addr 127.0.0.1 --http.port 8545 --http.api eth,net,web3,txpool,debug,parlia \
            --mine --miner.etherbase "$VALIDATOR" --unlock "$VALIDATOR" \
            --password pw.txt --allow-insecure-unlock \
            --nodiscover --maxpeers 0 --syncmode full --gcmode archive --verbosity 2 \
            > node.log 2>&1 &
          for i in $(seq 1 40); do
            n=$(curl -s -X POST -H 'Content-Type: application/json' \
                 --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                 http://127.0.0.1:8545 | sed -n 's/.*"result":"\([^"]*\)".*/\1/p') || true
            [ -n "$n" ] && [ "$n" != "0x0" ] && { echo "nœud prêt, bloc $((n))"; exit 0; }
            sleep 3
          done
          echo "::error::le nœud n'a pas démarré"; tail -40 node.log; exit 1

      - name: Vérifier le temps de bloc (5 s)
        working-directory: coinbosa
        run: node scripts/check-blocktime.js

      - name: Vérifier l'offre native (700 M, pont purgé)
        working-directory: coinbosa
        # Contrôle mécanique sur le genesis de DÉV (ALLOW_DEV_SUPPLY=1, explicite et bruyant).
        # La porte de production reste stricte : sans ce flag, un genesis coinbosaDev est refusé.
        run: GENESIS=genesis/genesis-coinbosa-dev.json ALLOW_DEV_SUPPLY=1 RPC=http://127.0.0.1:8545 node scripts/check-supply.js

      # Le stateRoot du bloc 0 engage TOUT l'état initial : le comparer à une empreinte
      # figée détecte n'importe quelle allocation cachée. En CI le genesis est régénéré à
      # chaque run (validateur jeté), donc l'empreinte varie : on vérifie ici que le
      # contrôle s'exécute et on affiche les valeurs. La comparaison stricte s'applique
      # à la production, où l'empreinte est figée dans genesis-reference.json.
      - name: Empreinte du bloc 0 (anti-allocation cachée)
        working-directory: coinbosa
        run: ALLOW_DEV_HASH=1 RPC=http://127.0.0.1:8545 node scripts/check-genesis-hash.js

      - name: Tests du standard BRC20
        working-directory: coinbosa
        run: RPC=http://127.0.0.1:8545 node scripts/test-brc20.js

      # Le bloc 200 est le premier bloc d'epoch : c'est là que le contrat système
      # est interrogé. Une régression sur CoinbosaValidatorSet fige la chaîne ici.
      - name: Franchir un bloc d'epoch
        working-directory: coinbosa
        run: node scripts/check-epoch.js

      - name: Journal du nœud en cas d'échec
        if: failure()
        working-directory: coinbosa
        run: tail -80 node.log
