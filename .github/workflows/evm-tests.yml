name: EVM Test

on:
  push:
    branches: 
      - master
      - develop

  pull_request:
    branches: 
      - master
      - develop
      - 'merge-v1.17.3*'

jobs:
  evm-test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Non-recursive: fetch top-level submodules (testdata, evm-benchmarks)
        # but not the nested LegacyTests, so TestLegacyState self-skips (its
        # Constantinople collision fixtures don't apply to BSC), matching upstream.
        submodules: true

    - uses: actions/cache@v4
      with:
        # In order:
        # * Module download cache
        # * Build cache (Linux)
        # * Build cache (Mac)
        # * Build cache (Windows)
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: EVM Test
      env:
        CGO_CFLAGS: "-O -D__BLST_PORTABLE__"
        CGO_CFLAGS_ALLOW: "-O -D__BLST_PORTABLE__"
        ANDROID_HOME: "" # Skip android test
      run: |
        go mod download
        # ci.go downloads the pinned execution-spec fixtures (build/checksums.txt)
        # and runs the tests; no shell wrapper / source patch needed anymore.
        # Non-short (required so fixtures are downloaded) full statetests need
        # more than ci.go's default 10m timeout.
        go run build/ci.go test -timeout 1h ./tests/
        